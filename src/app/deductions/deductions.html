<div class="deduction-container">
    <h2>📉 New Deduction Definition</h2>

    <form [formGroup]="deductionForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-row">
            <label for="name">Deduction Name</label>
            <input id="name" formControlName="name" type="text" placeholder="e.g. Food, Parking, Cleaning" />
        </div>

        <div class="form-row">
            <label for="startDate">Start Date</label>
            <input id="startDate" formControlName="startDate" type="date" />
        </div>

        <div class="form-row">
            <label for="frequency">Frequency</label>
            <select id="frequency" formControlName="frequency">
                <option value="once">One-Time</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>

        <div class="form-row">
            <label for="type">Calculation Type</label>
            <select id="type" formControlName="type">
                <option value="fixed">Fixed Amount</option>
                <option value="percentage">Percentage</option>
            </select>
        </div>

        <!-- Amount or Percentage -->
        <div class="form-row">
            <label for="value">{{ isPercentage ? 'Percentage (%)' : 'Amount (€)' }}</label>
            <input id="value" formControlName="value" type="number" step="0.01" />
        </div>

        <!-- Target Amount only for percentage -->
        <div class="form-row" *ngIf="isPercentage">
            <label for="targetAmount">Target Amount (€)</label>
            <input id="targetAmount" formControlName="targetAmount" type="number" step="0.01" />
        </div>

        <button type="submit" class="add-btn">➕ Add Deduction</button>
    </form>

    <hr />

    <h3>🗂️ Defined Deductions</h3>
    <ul>
        <li *ngFor="let d of deductions">
            <strong>{{ d.name }}</strong> – {{ d.frequency }} – {{ d.appliedAmount }}€
            <span *ngIf="d.type === 'percentage'">({{ d.value }}% → {{ d.targetAmount }}€)</span>
        </li>
    </ul>
</div>
