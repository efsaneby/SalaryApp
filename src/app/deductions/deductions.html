<div class="deduction-container">
    <h2>📉 New Deduction Definition</h2>

    <form [formGroup]="deductionForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-row">
            <label for="name">Deduction Name</label>
            <input id="name" formControlName="name" type="text" placeholder="e.g. Food, Parking, Cleaning" />
        </div>

        <div class="form-row">
            <label for="startDate">Start Date</label>
            <input id="startDate" formControlName="startDate" type="date" />
        </div>

        <div class="form-row">
            <label for="frequency">Frequency</label>
            <select id="frequency" formControlName="frequency">
                <option value="once">One-Time</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>

        <div class="form-row">
            <label for="type">Calculation Type</label>
            <select id="type" formControlName="type">
                <option value="fixed">Fixed Amount</option>
                <option value="percentage">Percentage</option>
            </select>
        </div>

        <!-- Amount or Percentage -->
        <div class="form-row">
            <label for="value">{{ deductionForm.get('type')?.value === 'percentage' ? 'Percentage (%)' : 'Amount (€)'
                }}</label>
            <input id="value" formControlName="value" type="number" step="0.01" />
        </div>

        <!-- Target Amount only for percentage -->
        <div class="form-row" *ngIf="deductionForm.get('type')?.value === 'percentage'">
            <label for="targetAmount">Target Amount</label>
            <select id="targetAmount" formControlName="targetAmount">
                <option value="">-- Enter manually or select --</option>
                <option value="Overtime130">Overtime130</option>
                <option value="GrossSalary">GrossSalary</option>
                <option value="NightToeslagTotal">NightToeslagTotal</option>
            </select>

            <input *ngIf="!deductionForm.get('isReference')?.value" id="targetAmountManual" type="number" step="0.01"
                placeholder="Manual amount (€)"
                (input)="deductionForm.get('targetAmount')?.setValue($any($event.target).value)" />

            <div class="checkbox-row">
                <input type="checkbox" id="isReference" formControlName="isReference" />
                <label for="isReference">Use as reference variable</label>
            </div>
        </div>

        <button type="submit" class="add-btn">➕ Add Deduction</button>
    </form>

    <hr />

    <h3>🗂️ Defined Deductions</h3>
    <ul>
        <li *ngFor="let d of deductions">
            <strong>{{ d.name }}</strong> – {{ d.frequency }} – {{ d.appliedAmount | currency:'EUR':'symbol':'1.2-2' }}
            <span *ngIf="d.type === 'percentage'">
                ({{ d.value }}% →
                <ng-container *ngIf="d.isReference; else manualAmount">
                    {{ d.targetAmount }}
                </ng-container>
                <ng-template #manualAmount>
                    <ng-container *ngIf="isNumeric(d.targetAmount); else rawText">
                        {{ d.targetAmount | currency:'EUR':'symbol':'1.2-2' }}
                    </ng-container>
                    <ng-template #rawText>
                        {{ d.targetAmount }}
                    </ng-template>
                </ng-template>
                )
            </span>
        </li>
    </ul>
</div>
